name: release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  desktop:
    permissions:
      contents: read
    uses: ./.github/workflows/install.yml
    with:
      version: ${{ github.ref_name }}

  android:
    name: public-release
    permissions:
      contents: read
    uses: ./.github/workflows/android-release-build.yml
    with:
      version: ${{ github.ref_name }}
      distribution: public
    secrets: inherit

  changelog:
    name: Generate changelog
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect prerelease
        id: release_type
        shell: bash
        run: |
          if [[ "${{ github.ref_name }}" =~ (alpha|beta|rc|dev) ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: .github/cliff.toml
          args: >-
            -vv --latest --strip header
            ${{ steps.release_type.outputs.is_prerelease == 'false' && '--tag-pattern "^v[0-9]+\\.[0-9]+\\.[0-9]+$"' || '' }}
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}

      - uses: actions/upload-artifact@v7
        with:
          name: release-changelog-${{ github.ref_name }}
          path: CHANGES.md
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [desktop, android, changelog]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: MaaAutoNaruto-win-*-${{ github.ref_name }}
          path: release-assets/desktop

      - name: Download macOS artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: MaaAutoNaruto-macos-*-${{ github.ref_name }}
          path: release-assets/desktop

      - name: Download Linux artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: MaaAutoNaruto-linux-*-${{ github.ref_name }}
          path: release-assets/desktop

      - name: Download Android APK (arm64-v8a)
        uses: actions/download-artifact@v8
        with:
          name: MaaAutoNaruto-android-public-release-arm64-v8a-${{ github.ref_name }}
          path: release-assets/android-arm64-v8a

      - name: Download Android APK (x86_64)
        uses: actions/download-artifact@v8
        with:
          name: MaaAutoNaruto-android-public-release-x86_64-${{ github.ref_name }}
          path: release-assets/android-x86_64

      - name: Download changelog
        uses: actions/download-artifact@v8
        with:
          name: release-changelog-${{ github.ref_name }}
          path: release-assets/changelog

      - name: Package desktop artifacts
        shell: bash
        run: |
          shopt -s nullglob
          for directory in release-assets/desktop/*; do
            name=$(basename "$directory")
            if [[ "$name" == MaaAutoNaruto-macos-* || "$name" == MaaAutoNaruto-linux-* ]]; then
              (cd "$directory" && tar -czf "../../../$name.tar.gz" .)
            else
              (cd "$directory" && zip -r "../../../$name.zip" .)
            fi
          done

      - name: Rename Android APKs
        shell: bash
        run: |
          mv "release-assets/android-arm64-v8a"/*.apk \
            "MaaAutoNaruto-android-public-release-arm64-${{ github.ref_name }}.apk"
          mv "release-assets/android-x86_64"/*.apk \
            "MaaAutoNaruto-android-public-release-amd64-${{ github.ref_name }}.apk"

      - name: Detect prerelease
        id: release_type
        shell: bash
        run: |
          if [[ "${{ github.ref_name }}" =~ (alpha|beta|rc|dev) ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          body_path: release-assets/changelog/CHANGES.md
          draft: false
          prerelease: ${{ steps.release_type.outputs.is_prerelease == 'true' }}
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            MaaAutoNaruto-*.tar.gz
            MaaAutoNaruto-*.zip
            MaaAutoNaruto-android-*.apk

      - name: Trigger CLI release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CLI_RELEASE_PAT }}
        run: |
          gh workflow run --repo duorua/MaaAutoNaruto build-cli.yml \
            -f tag=${{ github.ref_name }} \
            -f source_ref=${{ github.ref_name }} \
            -f picli_tag=v5.13.0-beta.2 \
            -f is_prerelease=${{ steps.release_type.outputs.is_prerelease }}

      - name: Trigger MirrorChyan workflows
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run --repo "$GITHUB_REPOSITORY" mirrorchyan_release.yml -f tag="${{ github.ref_name }}"
          gh workflow run --repo "$GITHUB_REPOSITORY" mirrorchyan_release_note.yml -f tag="${{ github.ref_name }}"
