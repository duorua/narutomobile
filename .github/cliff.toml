[remote.github]
owner = "duorua"
repo = "narutomobile"

[changelog]
# 标题
header = """
# 更新日志
"""

body = """
{%- macro remote_url() -%}
  https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}
{%- endmacro -%}

{% macro print_commit(commit) -%}
    - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
        {% if commit.breaking %}[**breaking**] {% endif %}\
        {{ commit.message | split(pat="\n") | first | upper_first }} [{{ commit.id | truncate(length=7, end="") }}]({{ self::remote_url() }}/commit/{{ commit.id }}) \
        @{{ commit.author.name }}
        {%- if commit.footers -%}
            {%- for footer in commit.footers -%}
                {%- if footer.token == "Co-authored-by" -%}
                    {%- set co_author_name = footer.value | split(pat=" <") | first | trim %} @{{ co_author_name }}
                {%- endif -%}
            {%- endfor -%}
        {%- endif %}
{% endmacro -%}

{% if version %}\
    ## {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% else %}\
    ## 未发布
{% endif %}\

{% if version and version is containing("-ci") %}
**⚠️ 欢迎使用内部测试版本，包含最不稳定但是最新的功能**

{% elif version and version is matching(".*(rc|alpha|beta).*") %}
**⚠️ 你正在使用的是公测版，这不是一个稳定版本！**

{% endif %}

{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits
    | filter(attribute="scope")
    | sort(attribute="scope") %}
        {{ self::print_commit(commit=commit) }}
    {%- endfor %}
    {% for commit in commits %}
        {%- if not commit.scope -%}
            {{ self::print_commit(commit=commit) }}
        {% endif -%}
    {% endfor -%}
{% endfor -%}
{%- if github -%}
{% if github.contributors | filter(attribute="is_first_time", value=true) | length != 0 %}
  ## 新贡献者 ❤️
{% endif %}\
{% for contributor in github.contributors | filter(attribute="is_first_time", value=true) %}
  * @{{ contributor.username }} made their first contribution
    {%- if contributor.pr_number %} in \
      [#{{ contributor.pr_number }}]({{ self::remote_url() }}/pull/{{ contributor.pr_number }}) \
    {%- endif %}
{%- endfor -%}
{%- endif %}
"""

# 尾部
footer = """
{%- macro remote_url() -%}
  https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}
{%- endmacro -%}

{%- set latest_version = "" -%}
{%- for release in releases -%}
  {%- if release.version and latest_version == "" -%}
    {%- set_global latest_version = release.version -%}
  {%- endif -%}
{%- endfor %}

> 本项目GitHub链接: [duorua/narutomobile](https://github.com/duorua/narutomobile)  
> 最新稳定版下载地址: [release](https://github.com/duorua/narutomobile/releases/latest)  
> 用户QQ群: [1047724031](https://qm.qq.com/q/owetU4d3Yk)
> 软件本体完全免费，若您有付费购买请立即退款并举报！  

> [!NOTE]  
> 如果没有特殊需求，请使用以下链接下载：<br>
> 手机版: [Android ARM64 (.apk)]({{ self::remote_url() }}/releases/download/{{ latest_version }}/MaaAutoNaruto-android-public-release-arm64-{{ latest_version }}.apk)<br>
> PC版: [Windows x86_64 (.zip)]({{ self::remote_url() }}/releases/download/{{ latest_version }}/MaaAutoNaruto-win-x86_64-{{ latest_version }}.zip)<br>
> macOS版: [Apple Silicon (.tar.gz)]({{ self::remote_url() }}/releases/download/{{ latest_version }}/MaaAutoNaruto-macos-aarch64-{{ latest_version }}.tar.gz) / [Intel (.tar.gz)]({{ self::remote_url() }}/releases/download/{{ latest_version }}/MaaAutoNaruto-macos-x86_64-{{ latest_version }}.tar.gz)
"""


[git]
# 过滤提交
conventional_commits = true   # 使用约定式提交格式
filter_unconventional = false # 不过滤非约定式提交
# 启用完整的 commit 信息
split_commits = false
# 保留完整的 commit body
protect_breaking_commits = false
commit_parsers = [
    { message = ".*Update interface schema files from MaaFramework.*", skip = true },
    { message = "^feat", group = "<!-- 0 -->✨ 新功能" },
    { message = "^fix", group = "<!-- 1 -->🐛 Bug修复" },
    { message = "^docs", group = "<!-- 4 -->📚 文档" },
    { message = "^perf", group = "<!-- 3 -->🚀 性能优化" },
    { message = "^refactor", group = "<!-- 2 -->🚜 代码重构" },
    { message = "^style", group = "<!-- 5 -->🎨 样式" },
    { message = "^test", group = "<!-- 6 -->🧪 测试" },
    { message = "^chore\\(deps\\)", group = "📦 依赖更新" },
    { message = "^chore", group = "<!-- 8 -->🔧 日常维护" },
    { message = "^ci", group = "<!-- 7 -->⚙️ 持续集成" },
    { body = ".*security", group = "<!-- 9 -->🔒 安全" },
    { message = "^[Rr]evert", group = "<!-- 10 -->◀️ 撤销" },
    { message = "^build", group = "<!-- 11 -->💼 构建" },
]

# 忽略这些提交
ignore_tags = "rc"

# 排序规则
sort_commits = "oldest"

# 启用GitHub集成
[git.github]
commits = true
