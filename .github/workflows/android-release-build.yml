name: android-release-build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Artifact version (defaults to the current ref)
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        description: Version used in artifact names
        required: true
        type: string
      distribution:
        description: Artifact distribution
        required: true
        type: string
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      KEYSTORE_PASSWORD:
        required: false
      KEY_ALIAS:
        required: false
      KEY_PASSWORD:
        required: false

concurrency:
  group: android-release-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        abi: [arm64-v8a, x86_64]
    env:
      APK_ARTIFACT_NAME: MaaAutoNaruto-android-${{ inputs.distribution || 'internal' }}-release-${{ matrix.abi }}-${{ inputs.version || github.ref_name }}
      MAPPING_ARTIFACT_NAME: MaaAutoNaruto-android-${{ inputs.distribution || 'internal' }}-release-mapping-${{ matrix.abi }}-${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.15"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: Android/MaaFwApp/gradle/wrapper/gradle-wrapper.properties

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Cache MaaFramework and agent core (${{ matrix.abi }})
        uses: actions/cache@v6
        with:
          path: |
            Android/MaaFwApp/.maa-cache
            Android/MaaFwApp/.maafw
          key: android-native-${{ runner.os }}-fw5.13.0-core3.13.15-${{ matrix.abi }}
          restore-keys: |
            android-native-${{ runner.os }}-fw5.13.0-core3.13.15-
            android-native-${{ runner.os }}-

      - name: Write local.properties
        run: |
          {
            echo "sdk.dir=${ANDROID_SDK_ROOT}"
            echo "pi.profile=../profile.yaml"
            echo "build.releaseAbi=${{ matrix.abi }}"
          } > Android/MaaFwApp/local.properties

      - name: Prepare PI tree
        run: python tools/prepare_android_pi.py

      - name: Configure app identity
        env:
          DISTRIBUTION: ${{ inputs.distribution || 'internal' }}
        run: python tools/configure_android_app_identity.py --distribution "$DISTRIBUTION"

      - name: Fetch MaaFramework native libs (${{ matrix.abi }})
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python Android/MaaFwApp/scripts/setup_maa_framework.py --abi ${{ matrix.abi }} --tag v5.13.0

      - name: Pack agent runtime (${{ matrix.abi }})
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python Android/MaaFwApp/scripts/build_agent_bundle.py --out Android/agent-dist \
            --abi arm64-v8a --abi x86_64 \
            --requirements requirements.txt \
            --exclude pillow --exclude opencv-python --exclude win32-setctime --exclude colorama --exclude jeepney \
            --require pillow==11.0.0 --extra-index-url https://chaquo.com/pypi-13.1/

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::warning::Android signing secrets are incomplete; the Release APK will be unsigned."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Assemble release APK (${{ matrix.abi }})
        working-directory: Android/MaaFwApp
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease

      - name: Rename release APK
        working-directory: Android/MaaFwApp
        shell: bash
        run: |
          apk_dir="app/build/outputs/apk/release"
          apks=("$apk_dir"/*.apk)
          if (( ${#apks[@]} != 1 )) || [[ ! -f "${apks[0]}" ]]; then
            echo "Expected exactly one release APK in $apk_dir" >&2
            exit 1
          fi
          mv "${apks[0]}" "$apk_dir/${APK_ARTIFACT_NAME}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK_ARTIFACT_NAME }}
          path: Android/MaaFwApp/app/build/outputs/apk/release/${{ env.APK_ARTIFACT_NAME }}.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.MAPPING_ARTIFACT_NAME }}
          path: Android/MaaFwApp/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
