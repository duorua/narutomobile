name: android

on:
  push:
    branches:
      - "**"
    paths:
      - ".github/workflows/android.yml"
      - "Android/**"
      - "tools/prepare_android_pi.py"
      - "assets/**"
      - "agent/**"
      - "requirements.txt"
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/android.yml"
      - "Android/**"
      - "tools/prepare_android_pi.py"
      - "assets/**"
      - "agent/**"
      - "requirements.txt"
  workflow_dispatch:

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  debug:
    name: Debug APK (${{ matrix.abi }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.15"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: Android/MaaFwApp/gradle/wrapper/gradle-wrapper.properties

      - uses: android-actions/setup-android@v4

      - name: Cache MaaFramework and agent core
        uses: actions/cache@v6
        with:
          path: |
            Android/MaaFwApp/.maa-cache
            Android/MaaFwApp/.maafw
          key: android-native-${{ runner.os }}-fw5.12.3-core3.13.15-${{ matrix.abi }}
          restore-keys: |
            android-native-${{ runner.os }}-fw5.12.3-core3.13.15-
            android-native-${{ runner.os }}-

      - name: Write local.properties
        run: |
          {
            echo "sdk.dir=${ANDROID_SDK_ROOT}"
            echo "pi.profile=../profile.yaml"
            echo "build.debugAbi=${{ matrix.abi }}"
          } > Android/MaaFwApp/local.properties

      - name: Prepare PI tree
        run: python tools/prepare_android_pi.py

      # Only this runner's checkout is modified; the reusable release workflow starts clean.
      - name: Use internal-test app identity
        run: |
          python - <<'PY'
          from pathlib import Path

          profile = Path("Android/profile.yaml")
          text = profile.read_text()
          replacements = {
              "  id: man\n": "  id: man.ci\n",
              "  label: MAN\n": "  label: MAN 内测版\n",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one {old.strip()!r} in {profile}")
              text = text.replace(old, new)
          profile.write_text(text)
          PY

      - name: Fetch MaaFramework native libs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python Android/MaaFwApp/scripts/setup_maa_framework.py --abi ${{ matrix.abi }} --tag v5.13.0-beta.5

      - name: Pack agent runtime
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python Android/MaaFwApp/scripts/build_agent_bundle.py --out Android/agent-dist \
            --requirements requirements.txt \
            --exclude pillow --exclude win32-setctime --exclude colorama --exclude jeepney \
            --require pillow==11.0.0 --extra-index-url https://chaquo.com/pypi-13.1/

      - name: Assemble debug APK
        working-directory: Android/MaaFwApp
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v7
        with:
          name: MaaAutoNaruto-android-${{ matrix.abi }}-${{ github.sha }}
          path: Android/MaaFwApp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    name: Release APK
    permissions:
      contents: read
    uses: ./.github/workflows/android-release.yml
    with:
      version: ${{ github.sha }}
    secrets: inherit
