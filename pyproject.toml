[project]
name = "maaautonaruto"
version = "1.1.13"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "json-with-comments>=1.2.10",
    "loguru>=0.7.3",
    "maafw>=5.12.1",
    "notify-py>=0.3.2",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.0.0",
    "pip>=26.1.2",
    "scikit-image>=0.26.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=8.0",
    "ruff>=0.11.0",
]

[tool.uv]
index-url = "https://mirrors.cloud.tencent.com/pypi/simple"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
exclude = ["deps", ".venv", "temp", "debug", "install", "build"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F403", "F405"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["agent", "tools"]
extraPaths = ["agent"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingTypeStubs = "none"
reportAttributeAccessIssue = "none"
# MaaFramework API returns Optional types that are checked at runtime
# but Pyright cannot infer the None-safety through the control flow
reportOptionalMemberAccess = "none"
reportOptionalOperand = "none"
reportOperatorIssue = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "agent"]
