name: check

on:
  push:
    branches:
      - "**"
    paths:
      - ".github/workflows/*.yml"
      - "assets/**"
      - "**.py"
      - "pyproject.toml"
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/*.yml"
      - "assets/**"
      - "**.py"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  resource:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      # pip install maafw
      - name: Install maafw
        run: |
          python -m pip install --upgrade pip
          # 在 requirements.txt 中查找以 maafw 开头的行（例如: maafw==4.5.6 或 maafw>=4.5）
          line=$(grep -E '^\s*maafw' requirements.txt | head -n 1)
          if [ -n "$line" ]; then
            pkg=$(echo "$line" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          else
            pkg='maafw'
          fi
          echo "Installing $pkg"
          python -m pip install --upgrade $pkg

      - name: Check Resource
        run: |
          python ./tools/ci/check_resource.py ./assets/resource/base

      - name: Check Interface
        run: |
          pnpm install --frozen-lockfile
          pnpm exec maa-tools check
